<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">

<title>First Basket Model</title>
<style>
:root{--bg:#0e0b0c;--card:#151012;--line:#2a2123;--muted:#8d8285;--text:#f3eeef;--red:#e5484d;--green:#3fb950;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,Roboto,sans-serif;color:var(--text);
background:linear-gradient(180deg,#4a1216 0,#2a0c0f 260px,var(--bg) 520px);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:18px 12px 60px}
h1{font-size:22px;margin:6px 4px 2px;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:0 4px 14px}
.tabs{display:flex;background:#120d0e;border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin-bottom:14px}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font:600 14px inherit;font-family:inherit;padding:10px 4px;border-radius:12px;cursor:pointer}
.tabs button.on{background:#2a2426;color:var(--text)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:16px}
.ptitle{font-weight:700;font-size:17px;text-align:center;margin:2px 0 12px}
.badge{display:inline-flex;align-items:center;justify-content:center;font:800 11px/1 inherit;font-family:inherit;padding:5px 6px;border-radius:6px;border:2px solid #c9a24a;min-width:38px;letter-spacing:.3px}
.badge.big{font-size:20px;padding:12px 16px;border-radius:14px;min-width:78px}
.matchup{display:flex;align-items:center;justify-content:space-around;margin:4px 0 10px}
.matchup .at{color:var(--muted);font-size:13px}
.bar{height:6px;background:#2a2426;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red);border-radius:4px}
.sfrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.sfrow b{color:var(--text)}
.tipnote{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 10px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0}
.prow .nm{flex:1;font-size:15px}
.prow .pc{font-weight:700;font-size:15px;width:60px;text-align:right}
.prow .od{color:var(--muted);font-size:13px;width:52px;text-align:right}
.game+.game{border-top:1px solid var(--line);margin-top:10px;padding-top:14px}
table{width:100%;border-collapse:collapse}
th{color:var(--muted);font-weight:500;font-size:12px;text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
td{padding:11px 4px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
td.rk{width:30px;color:var(--text)}
tr.top td.rk{color:var(--red);font-weight:700}
tr.cut td{border-bottom:1px dashed #5a4a4d}
.pname{font-size:15px;margin-bottom:4px}
.opp{color:var(--muted);font-size:11px;margin-left:4px}
.prob{font-weight:700;white-space:nowrap}
.mini{width:70px}
.book{width:68px;background:#1e1819;border:1px solid #3a3033;color:var(--text);border-radius:8px;padding:7px 6px;font:14px inherit;font-family:inherit}
.book::placeholder{color:#5f5558}
.edge{font-weight:700;white-space:nowrap;font-size:13px}
.pos{color:var(--green)}.neg{color:var(--muted)}
.hidesm{}
@media (max-width:560px){.hidesm{display:none}.mini{width:40px}td{font-size:13px}}
.btn{background:#2a2426;border:1px solid #3a3033;color:var(--text);border-radius:10px;padding:8px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.editbox{background:#100c0d;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.editbox label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.editbox input,.editbox select{background:#1e1819;border:1px solid #3a3033;color:var(--text);border-radius:8px;padding:7px;font:14px inherit;font-family:inherit;width:100%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:end}
.ddgrid{display:grid;grid-template-columns:2fr .8fr .8fr .8fr auto;gap:6px;margin-bottom:6px;align-items:end}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.warn{color:#f0b429}
.how p,.how li{color:#d6cdcf;font-size:14px;line-height:1.55}
.how code{background:#221b1d;padding:2px 6px;border-radius:6px;font-size:13px}
.how h3{font-size:15px;margin:18px 0 6px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px;gap:8px;flex-wrap:wrap}
.asof{color:var(--muted);font-size:12px;margin:-8px 4px 12px}
.asof b{color:#f0b429}
.upd{color:var(--muted);font-size:12px;margin:-8px 4px 12px}
.loadmsg{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;margin:4px 0 12px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.topbar>div:first-child{min-width:0}
.donate{display:flex;gap:8px;flex-shrink:0;padding-top:8px;align-items:center}
.donate-label{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--green);white-space:nowrap}
.donate a{display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;color:#fff;white-space:nowrap}
.donate a.venmo{background:#008cff}
.donate a.zelle{background:#6d1ed4}
@media (max-width:420px){.donate{gap:6px;padding-top:7px}.donate-label{font-size:11px}.donate a{padding:7px 11px;font-size:12.5px}}

/* artifact hardening: no sideways scroll, tabs stay usable on narrow phones */
html,body{overflow-x:hidden}
img,table{max-width:100%}
@media (max-width:420px){.tabs button{font-size:12.5px;padding:9px 2px}.panel{padding:13px 10px}h1{font-size:20px}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:1px}
</style>
</head>

<script>
const LS='fbmodel.v1';
const COLORS={ATL:'#c8102e',BOS:'#2f7a3a',BKN:'#111',CHA:'#1d8cab',CHI:'#ce1141',CLE:'#6f263d',DAL:'#0b64c0',DEN:'#0e2240',DET:'#c8102e',GSW:'#1d428a',HOU:'#ce1141',IND:'#002d62',LAC:'#1d428a',LAL:'#552583',MEM:'#5d76a9',MIA:'#98002e',MIL:'#00471b',MIN:'#236192',NOP:'#0c2340',NYK:'#2c6fc4',OKC:'#007ac1',ORL:'#0077c0',PHI:'#006bb6',PHX:'#1d1160',POR:'#e03a3e',SAC:'#5a2d81',SAS:'#c4ced4',TOR:'#ce1141',UTA:'#002b5c',WAS:'#002b5c'};
let SLATE=null,FB=null,TRACK=null;
let postasb=null,fblog=null,slate=null,track=null;
const nk=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s*\(q\)/,'').replace(/[.']/g,'').replace(/ (jr|iii|ii)$/,'').trim();
let HIST={};
function buildHist(){HIST={};
for(const [t,v] of Object.entries(FB.seed||{})){const h=HIST[t]={n:v.n,c:{},g:{}};for(const [p,c] of Object.entries(v.p))h.c[nk(p)]=(h.c[nk(p)]||0)+c;for(const [p,s] of Object.entries(v.g||{}))h.g[nk(p)]=+s;}
for(const e of FB.log||[]){const h=HIST[e.t]=HIST[e.t]||{n:0,c:{},g:{}};h.n++;h.c[nk(e.fg)]=(h.c[nk(e.fg)]||0)+1;}
for(const [t,m] of Object.entries(FB.g||{})){const h=HIST[t]=HIST[t]||{n:0,c:{},g:{}};for(const [p,s] of Object.entries(m))h.g[nk(p)]=+s;}}
const hist=(t,n)=>{const h=HIST[t]||{n:0,c:{},g:{}};const g=h.g[nk(n)];return {n:h.n,c:h.c[nk(n)]||0,g,trials:g===undefined?h.n:g};};
const adjSh=(t,p)=>{const h=hist(t,p.n),K=FB.K||20;if(h.g===0)return +p.sh;return 100*(K*(+p.sh)/100+h.c)/(K+h.trials);};
let DEFAULT=null,S=null;
function loadState(){DEFAULT={games:SLATE.games,dd:SLATE.dd,book:{},ddbook:{},date:SLATE.date};
 try{S=JSON.parse(localStorage.getItem(LS))}catch(e){S=null} if(!S||!S.games||S.date!==SLATE.date) S=JSON.parse(JSON.stringify(DEFAULT));}
let tab='fb', editing=null, showAll=false;
const save=()=>{if(!S)return;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};

// ---------- math ----------
// P(team with first possession scores first), alternating possessions, per-possession score rates a (them) & b (opp)
const firstPoss=(a,b)=>a/(a+b-a*b);
function gameCalc(g){
  const t=g.awayTip/100,a=g.awayRate/100,h=g.homeRate/100;
  const awayFirst=t*firstPoss(a,h)+(1-t)*(1-firstPoss(h,a));
  return {away:awayFirst,home:1-awayFirst};
}
const fair=p=>p<=0?'—':p>=1?'-∞':p>=.5?'-'+Math.round(100*p/(1-p)):'+'+Math.round(100*(1-p)/p);
function implied(o){o=parseFloat(o);if(!isFinite(o)||o===0||Math.abs(o)<100)return null;return o>0?100/(o+100):-o/(-o+100);}
function decimal(o){o=parseFloat(o);return o>0?1+o/100:1+100/-o;}
function edgeHTML(p,o){const ip=implied(o);if(ip==null)return '<span class="neg">—</span>';
  const ev=p*decimal(o)-1;const cls=ev>0?'pos':'neg';
  return `<span class="${cls}">${ev>0?'+':''}${(ev*100).toFixed(1)}% EV</span>`;}
function allPlayers(){const out=[];S.games.forEach((g,gi)=>{const c=gameCalc(g);g.players.forEach(p=>{
  const team=p.s==='away'?g.away:g.home,opp=p.s==='away'?g.home:g.away;
  out.push({n:p.n,team,opp,vs:p.s==='away'?'@':'vs',p:c[p.s]*adjSh(team,p)/100,key:gi+'|'+p.n});});});
  return out.sort((x,y)=>y.p-x.p);}
// double-double
function poisGE(m,k){let c=0,t=Math.exp(-m);for(let i=0;i<k;i++){c+=t;t*=m/(i+1);}return 1-c;}
function normGE(m,sd,k){const z=(k-.5-m)/sd;return .5*erfc(z/Math.SQRT2);}
function erfc(x){const z=Math.abs(x),t=1/(1+.5*z),r=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))));return x>=0?r:2-r;}
function ddProb(d){const pp=normGE(d.pts,Math.max(3,.28*d.pts+2),10),pr=poisGE(+d.reb||0,10),pa=poisGE(+d.ast||0,10);
  return pp*pr+pp*pa+pr*pa-2*pp*pr*pa;}

// ---------- render ----------
const badge=(t,big)=>`<span class="badge${big?' big':''}" style="background:${COLORS[t]||'#333'};color:${t==='SAS'?'#111':'#fff'};border-color:${t==='BKN'?'#fff':'#c9a24a'}">${t}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  if(!S)return;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const v=document.getElementById('view');
  if(tab==='fb')v.innerHTML=renderRank()+renderGames();
  else if(tab==='dd')v.innerHTML=renderDD();
  else if(tab==='track')v.innerHTML=renderTrack();
  else v.innerHTML=renderHow();
}
function renderRank(){
  const all=allPlayers();const ps=showAll?all:all.slice(0,25);const max=all[0]?all[0].p:1;
  return `<div class="panel"><div class="ptitle">All players, ranked</div><table>
  <tr><th>#</th><th>Player</th><th>Prob.</th><th class="hidesm"></th><th>Fair</th><th>Book</th><th>Edge</th></tr>
  ${ps.map((x,i)=>`<tr class="${i<3?'top':''} ${i===2?'cut':''}"><td class="rk">${i+1}</td>
   <td><div class="pname">${esc(x.n)}</div>${badge(x.team)}<span class="opp">${x.vs} ${x.opp}</span></td>
   <td class="prob">${(x.p*100).toFixed(1)}%</td>
   <td class="hidesm"><div class="bar mini"><i style="width:${x.p/max*100}%"></i></div></td>
   <td>${fair(x.p)}</td>
   <td><input class="book" inputmode="numeric" placeholder="+600" data-book="${esc(x.key)}" value="${esc(S.book[x.key]||'')}"></td>
   <td class="edge" id="e-${esc(x.key)}">${edgeHTML(x.p,S.book[x.key])}</td></tr>`).join('')}
  </table>${all.length>25?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" data-act="all">${showAll?'Show top 25':'Show all '+all.length}</button></div>`:''}</div>`;
}
function renderGames(){
  return `<div class="toolbar"><div class="sub" style="margin:0">Tap a game's Edit to change inputs.</div>
   <div class="row"><button class="btn sm" data-act="addgame">+ Game</button><button class="btn sm" data-act="reset">Reset</button></div></div>
  <div class="panel">${S.games.map((g,gi)=>{const c=gameCalc(g);
   const list=g.players.map(p=>{const team=p.s==='away'?g.away:g.home;return {...p,team,h:hist(team,p.n),p:c[p.s]*adjSh(team,p)/100};}).sort((a,b)=>b.p-a.p);
   const awaySh=g.players.filter(p=>p.s==='away').reduce((a,p)=>a+ +p.sh,0),homeSh=g.players.filter(p=>p.s==='home').reduce((a,p)=>a+ +p.sh,0);
   return `<div class="game"><div class="matchup">${badge(g.away,1)}<span class="at">at</span>${badge(g.home,1)}</div>
   <div class="sfrow"><span>Scores first <b>${(c.away*100).toFixed(1)}%</b></span><b>${(c.home*100).toFixed(1)}%</b></div>
   <div class="bar"><i style="width:${c.away*100}%"></i></div>
   <div class="tipnote">${g.away} wins the tip ${(+g.awayTip).toFixed(1)}% of the time${g.tipNote?`<br>${esc(g.tipNote)}${g.line?' · '+esc(g.line):''}`:''}</div>
   ${list.map(p=>`<div class="prow">${badge(p.team)}<span class="nm">${esc(p.n)}${p.h.n?`<span class="opp"> ${p.h.c}/${p.h.trials} firsts</span>`:''}</span><span class="pc">${(p.p*100).toFixed(1)}%</span><span class="od">${fair(p.p)}</span></div>`).join('')}
   <div class="row" style="justify-content:flex-end"><button class="btn sm" data-act="edit" data-g="${gi}">${editing===gi?'Done':'Edit'}</button></div>
   ${editing===gi?editBox(g,gi,awaySh,homeSh):''}</div>`;}).join('')}</div>`;
}
function editBox(g,gi,aS,hS){
  return `<div class="editbox">
   <div class="grid">
    <div><label>Away</label><input data-gf="away" data-g="${gi}" value="${esc(g.away)}" maxlength="4"></div>
    <div><label>Home</label><input data-gf="home" data-g="${gi}" value="${esc(g.home)}" maxlength="4"></div>
    <div><label>Away tip win %</label><input type="number" step="0.1" data-gf="awayTip" data-g="${gi}" value="${g.awayTip}"></div>
    <div></div>
    <div><label>${esc(g.away)} score rate %</label><input type="number" step="0.1" data-gf="awayRate" data-g="${gi}" value="${g.awayRate}"></div>

    ${S.dd.map((d,i)=>`<div class="ddgrid">
     <input data-df="n" data-i="${i}" value="${esc(d.n)}"><input data-df="t" data-i="${i}" value="${esc(d.t)}" maxlength="4">

function renderTrack(){
  const TR=TRACK;
  const done=[],pend=[];
  TR.nights.forEach(n=>n.games.forEach(g=>{(g.act?done:pend).push({...g,d:n.d});}));
  if(!done.length)return `<div class="panel"><div class="ptitle">Track record</div><p class="hint">No scored games yet.</p></div>`;
  let top=0,topE=0,top3=0,team=0,ll=0,llN=0,sumP=0,bench=0;const B=[[0,.08],[.08,.11],[.11,.14],[.14,1]].map(b=>({lo:b[0],hi:b[1],n:0,e:0,a:0}));
  const byNight={};
  done.forEach(g=>{
    const nb=byNight[g.d]=byNight[g.d]||{d:g.d,n:0,top:0,topE:0,team:0};nb.n++;
    const i=g.p.findIndex(x=>nk(x[0])===nk(g.act.fg));const pr=i>=0?g.p[i][2]:0;
    const [aw]=g.g.split('@');const pt=g.act.t===aw?g.pa:1-g.pa;
    if(pt>.5){team++;nb.team++;}
    topE+=g.p[0][2];nb.topE+=g.p[0][2];
    if(i===0){top++;nb.top++;} if(i>=0&&i<3)top3++; if(i<0)bench++;
    sumP+=pr; ll+=-Math.log(Math.max(pr,.01));
    g.p.forEach(x=>{const b=B.find(b=>x[2]>=b.lo&&x[2]<b.hi);b.n++;b.e+=x[2];if(nk(x[0])===nk(g.act.fg))b.a++;});
  });
  const N=done.length,pct=x=>(x*100).toFixed(1)+'%';
  const naive=-Math.log(.096);
  const stat=(l,v,s)=>`<div style="background:#100c0d;border:1px solid var(--line);border-radius:14px;padding:12px"><div style="font-size:11px;color:var(--muted)">${l}</div><div style="font-size:20px;font-weight:700;margin:4px 0">${v}</div><div style="font-size:12px;color:var(--muted)">${s}</div></div>`;
  return `<div class="panel"><div class="ptitle">Track record</div>
   <div class="sub" style="text-align:center;margin-bottom:12px">${Object.keys(byNight).length} night${Object.keys(byNight).length>1?'s':''} · ${N} games scored${pend.length?` · ${pend.length} pending`:''}</div>
   <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
    ${stat('Top pick hit',`${top}/${N}`,`model expected ${topE.toFixed(1)}`)}
    ${stat('Scorer in top 3',`${top3}/${N}`,`${pct(top3/N)} of games`)}
    ${stat('Team scores first',`${team}/${N}`,`${pct(team/N)} · coin flip 50%`)}
    ${stat('Avg prob on actual scorer',pct(sumP/N),`naive split 9.6%`)}
   </div>
   <p class="hint" style="margin-top:10px">Log loss ${(ll/N).toFixed(3)} vs naive ${naive.toFixed(3)} (lower is better; a scorer the model didn't rank counts at 1%). ${bench} first basket${bench===1?'':'s'} by a non-starter. Small samples are mostly noise — judge after a few hundred games.</p>
  </div>
  <div class="panel"><div class="ptitle">Calibration</div><table>
   <tr><th>Model prob</th><th>Players</th><th>Expected</th><th>Actual</th></tr>
   ${B.map(b=>`<tr><td>${b.hi<1?Math.round(b.lo*100)+'–'+Math.round(b.hi*100)+'%':Math.round(b.lo*100)+'%+'}</td><td>${b.n}</td><td>${b.e.toFixed(1)}</td><td>${b.a}</td></tr>`).join('')}
  </table><p class="hint">Well calibrated = Actual close to Expected in every row.</p></div>
  <div class="panel"><div class="ptitle">By night</div><table>
   <tr><th>Date</th><th>Games</th><th>Top pick</th><th>Exp.</th><th>Team first</th></tr>
   ${Object.values(byNight).sort((a,b)=>b.d<a.d?-1:1).map(n=>`<tr><td>${n.d.slice(5)}</td><td>${n.n}</td><td>${n.top}</td><td>${n.topE.toFixed(1)}</td><td>${n.team}/${n.n}</td></tr>`).join('')}
  </table></div>
  <div class="panel"><div class="ptitle">Recent games</div><table>
   <tr><th>Game</th><th>First basket</th><th>Model</th><th>Rank</th></tr>
   ${done.sort((a,b)=>b.d<a.d?-1:b.d>a.d?1:0).slice(0,30).map(g=>{const i=g.p.findIndex(x=>nk(x[0])===nk(g.act.fg));
     return `<tr class="${i===0?'top':''}"><td><span class="opp" style="margin:0">${g.d.slice(5)}</span><br>${g.g}</td><td>${esc(g.act.fg)}<br><span class="opp" style="margin:0">top: ${esc(g.p[0][0])}</span></td><td class="prob">${i>=0?pct(g.p[i][2]):'bench'}</td><td class="rk">${i>=0?i+1:'—'}</td></tr>`;}).join('')}
  </table></div>`;
}
function renderHow(){return `<div class="panel how">
 <div class="ptitle">How it works</div>
 <h3>1. Who scores first (team)</h3>
 <p>Each team gets a <b>score rate</b>: the chance any single possession ends in a made basket. Possessions alternate, so if Team A has the ball first:</p>
 <p><code>P(A first) = a ÷ (a + b − a·b)</code></p>
 <p>With both teams at 50%, the team that wins the tip scores first about 67% of the time. Then it's weighted by the jump ball:</p>
 <p><code>P(A first) = tip · P(first | A has ball) + (1 − tip) · (1 − P(B first | B has ball))</code></p>
 <h3>2. Who scores first (player)</h3>
 <p><code>Player prob = team scores-first prob × player's share</code>. Share is the % of that team's opening baskets the player takes. Good proxy: his share of team first-quarter FG attempts among starters, bumped for stars who get the first play called.</p>
 <h3>2b. Actual first-basket history</h3>
 <p>Each team's real first-basket record is mixed in: <code>share = (20 × model share + times he scored the team's first basket) ÷ (20 + games he started for that team)</code>. The trial count is the player's own starts, so he's only shrunk for games he actually started — a player with no starts on record is charged the team's tracked games, and a player who hasn't started a tracked game keeps his model share. Early on the stats model dominates; as the season goes on, real results take over. The game cards show it as firsts/starts, e.g. <i>3/3 firsts</i>. History starts with this season's games and adds every night's results the next day.</p>
 <h3>3. Fair odds & edge</h3>
 <p>Fair odds are the no-vig American price for the model probability. Type a book price and Edge shows expected value per $1: <code>EV = p × decimal odds − 1</code>. Green = positive EV.</p>
 <h3>4. Double-double</h3>
 <p>From projected points, rebounds and assists. Points use a bell curve with real-game spread; rebounds and assists use exact Poisson counts (the chance a Poisson count with the projected mean reaches 10). P(DD) = chance at least two of the three reach 10, treating them as independent (slightly conservative for bigs whose stats move together).</p>
 <h3>5. Track record</h3>
 <p>Every night's predictions are frozen when the slate is built and scored the next day against the actual first field goal. The Track record tab shows top-pick hits vs. what the model expected, how often the right team scored first, and calibration (do 10% players score first about 10% of the time).</p>
 <h3>Where tonight's inputs come from</h3>
 <ul><li><b>Starters</b>: projected lineups for the night (Q = questionable).</li>
 <li><b>Tip win %</b>: each starting center's tip record (past seasons + this season), pulled toward 50% when the sample is small, then matched head-to-head (log5).</li>
 <li><b>Score rate</b>: from the betting line. Each team's implied total vs. the game average, scaled from a 45% league-average chance a possession ends in a made shot.</li>
 <li><b>Player stats</b>: last season <i>after the All-Star break</i> blended with this season. This season's weight = games ÷ (games + 15), or games ÷ (games + 8) for players on a new team. Post-break samples under 15 games are padded with the full-season average.</li>
 <li><b>Shares</b>: each starter's blended field goals made, compressed (FGM<sup>0.75</sup>) so stars don't get too much, split across the starting five. About 4% is left for the bench.</li>
 <li><b>Double-double</b>: blended points, rebounds and assists.</li></ul>
 <p class="hint">Not included yet: actual first-shot history by player (behind paywalls) and live lineup scratches. Starters lock ~30 min before tip, so check before betting.</p>
 <p class="hint">Everything you enter is saved in this browser only. Sample numbers are preloaded — update them before betting real money.</p>
</div>`;}

 if(a==='reset'){if(b.dataset.c){S=JSON.parse(JSON.stringify(DEFAULT));editing=null;}else{b.dataset.c=1;b.textContent='Tap to confirm';return;}}

 if(d.gf){const g=S.games[+d.g];g[d.gf]=(d.gf==='away'||d.gf==='home')?t.value.toUpperCase():+t.value;}
 else if(d.pf){const p=S.games[+d.g].players[+d.p];p[d.pf]=d.pf==='sh'?+t.value:t.value;}
 else if(d.df){const x=S.dd[+d.i];x[d.df]=(d.df==='n'||d.df==='t')?(d.df==='t'?t.value.toUpperCase():t.value):+t.value;}
 else return; save();render();});
// ---------- live data boot ----------
// Data comes from the repo's data.json (refreshed nightly by its GitHub Action).
// The four embedded JSON blocks above are kept only as a clearly labeled fallback.
function fmtDate(ds){try{return new Date(ds+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}catch(e){return ds;}}
function startApp(){
  buildHist();loadState();
  document.getElementById('sub').textContent='Slate for '+new Date(SLATE.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+' · '+SLATE.note+'. Enter book odds to find edges.';
  render();
}
function useLive(d){
  postasb=d.postasb;fblog=d.fblog;slate=d.slate;track=d.track;
  SLATE=slate;FB=fblog;TRACK=track;
  const asof=(d._meta&&d._meta.as_of)||SLATE.date;
  const el=document.getElementById('asof');if(el)el.textContent='Data as of '+fmtDate(asof);
  startApp();
}
function useFallback(){
  try{
    postasb=JSON.parse(document.getElementById('postasb').textContent);
    fblog=JSON.parse(document.getElementById('fblog').textContent);
    slate=JSON.parse(document.getElementById('slate').textContent);
    track=JSON.parse(document.getElementById('track').textContent);
  }catch(e){showError();return;}
  SLATE=slate;FB=fblog;TRACK=track;
  const el=document.getElementById('asof');if(el){el.innerHTML='Couldn\u2019t reach the live data \u2014 showing the <b>'+fmtDate(SLATE.date)+' slate</b> saved in this page. <button class="btn sm" id="retrybtn2" type="button">Try live data again</button>';const rb2=document.getElementById('retrybtn2');if(rb2)rb2.addEventListener('click',function(e){e.stopPropagation();boot();});}
  startApp();
}
function showError(){
  document.getElementById('view').innerHTML='<div class="panel"><div class="ptitle">Couldn\u2019t load tonight\u2019s data</div><p class="loadmsg">Check your connection and refresh. No numbers are shown rather than risk showing a stale slate.</p><div class="row" style="justify-content:center"><button class="btn red" id="retrybtn" type="button">Try again</button> <button class="btn" id="frozenbtn" type="button">View the slate saved in this page</button></div></div>';
  const rb=document.getElementById('retrybtn');if(rb)rb.addEventListener('click',function(e){e.stopPropagation();boot();});
  const fb=document.getElementById('frozenbtn');if(fb)fb.addEventListener('click',function(e){e.stopPropagation();useFallback();});
}
// The same data.json is mirrored on several independent CDNs. If one host is
// blocked or down, the next is tried; if every live source fails, the slate
// saved in this page is shown (labeled with its date) instead of nothing.
function dataSources(){
  const now=new Date(),pad=function(n){return String(n).padStart(2,'0');};
  const v=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'-'+pad(now.getHours())+pad(now.getMinutes());
  return [
    'https://lrrycw3.github.io/first-basket-model/data.json?v='+v,
    'https://raw.githubusercontent.com/lrrycw3/first-basket-model/main/data.json?v='+v,
    'https://cdn.jsdelivr.net/gh/lrrycw3/first-basket-model@main/data.json?v='+v,
    'https://raw.githack.com/lrrycw3/first-basket-model/main/data.json?v='+v
  ];
}
function fetchData(url){
  return new Promise(function(resolve,reject){
    let ctl=null,timer=null;
    if(window.AbortController){ctl=new AbortController();timer=setTimeout(function(){ctl.abort();},10000);}
    fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(function(r){if(timer)clearTimeout(timer);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(d){if(!d||!d.postasb||!d.fblog||!d.slate||!d.track)throw new Error('bad data');resolve(d);})
      .catch(function(e){if(timer)clearTimeout(timer);reject(e);});
  });
}
function boot(){
  document.getElementById('view').innerHTML='<div class="panel"><div class="ptitle">Loading tonight\u2019s slate\u2026</div><p class="loadmsg">Fetching the latest data.</p></div>';
  const urls=dataSources();let i=0;
  function attempt(){
    if(i>=urls.length){useFallback();return;}
    fetchData(urls[i++]).then(useLive).catch(function(){setTimeout(attempt,400);});
  }
  attempt();
}
boot();
</script>
